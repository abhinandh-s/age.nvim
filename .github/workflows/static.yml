name: Deploy to GitHub Paves

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TYPST_FEATURES: "bundle,html"

    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v4
  
      - name: Get my Typst UI library
        uses: abhinandh-s/typst-ui-kit@master

      - name: Run typst bundle
        run: typst compile main.typ dist --format bundle


      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Pretty print HTML with Deno
        run: |
          deno run -A npm:prettier --write "dist/**/*.html"


      - name: List output
        run: |
          ls
          ls dist/
          
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5