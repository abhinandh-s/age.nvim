name: Test Plugin
on:
  push:
  #  paths:
  #    - 'src/**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly

      - name: ls before
        run: |
          cd tests/config
          ls

      - name: Run Age genkey test
        run: |
          cd tests/config
          nvim --headless -u init.lua +"qa!"

      - name: ls after
        run: |
          cd tests/config
          ls

      - name: cat Decrypted File
        run: |
          cd tests/config
          cat secret.md
       
      - name: cat Encrypted File
        run: |
          cd tests/config
          cat secret.md.age

    